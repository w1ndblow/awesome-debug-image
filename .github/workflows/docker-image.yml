name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v2
      with:
        username: "windblow"
        password: ${{ secrets.DOCKERHUBPASS }}
    - name: Build the Docker image
      run: |
        ARGS="--tag windblow/awesome-debug:$GITHUB_SHA"
        if [ -n $GITHUB_REF]; then
          ARGS=$ARGS' --tag windblow/awesome-debug:$GITHUB_REF'
        fi
        docker build . --file Dockerfile $ARGS
        
        docker push windblow/awesome-debug:$GITHUB_SHA
        if [ -n $GITHUB_REF]; then 
          docker push windblow/awesome-debug:$GITHUB_REF; 
        fi
