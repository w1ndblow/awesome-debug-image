name: Release Docker Image

# Сборка и публикация образа при пуше тега v* (например, v1.2.3).
# Перед публикацией прогоняются тесты (pytest + testinfra).
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests (testinfra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest testinfra

      - name: Run tests
        run: pytest tests/ -v

  release:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write   # push в ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Публикуем и в Docker Hub, и в GitHub Container Registry
          images: |
            windblow/awesome-debug
            ghcr.io/${{ github.repository_owner }}/awesome-debug
          flavor: latest=false
          tags: |
            # имя тега без refs/tags/ (например, v1.2.3)
            type=ref,event=tag
            # плюс актуальный latest
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: windblow
          password: ${{ secrets.DOCKERHUBPASS }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
